name: IslandAI
options:
  bundleIdPrefix: com.ibrahimhalilsezgin
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: 16.1

targets:
  IslandAI:
    type: application
    platform: iOS
    deploymentTarget: 16.1
    sources:
      - path: IslandAI
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimhalilsezgin.islandai
      INFOPLIST_FILE: IslandAI/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: 1 # iPhone only
    dependencies:
      - target: IslandAIWidget
        embed: true

  IslandAIWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 16.1
    sources:
      - path: IslandAIWidget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimhalilsezgin.islandai.widget
      INFOPLIST_FILE: IslandAIWidget/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: 1 # iPhone only
      SKIP_INSTALL: YES
