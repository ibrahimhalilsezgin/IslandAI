name: IslandAI
options:
  bundleIdPrefix: com.ibrahimhalilsezgin
  deploymentTarget:
    iOS: 16.1

targets:
  IslandAI:
    type: application
    platform: iOS
    deploymentTarget: 16.1
    sources:
      - path: IslandAI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimhalilsezgin.islandai
      INFOPLIST_FILE: IslandAI/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: "" # Set via environment or manual if needed
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: 1 # iPhone only
    dependencies:
      - target: IslandAIWidget
        embed: true

  IslandAIWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 16.1
    sources:
      - path: IslandAIWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ibrahimhalilsezgin.islandai.widget
      INFOPLIST_FILE: IslandAIWidget/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: 5.0
      TARGETED_DEVICE_FAMILY: 1 # iPhone only
      SKIP_INSTALL: YES
